[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "plato-dialogues"
version = "0.0.1"
description = "Planning RV follow-up of PLATO transiting planets"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "João Faria", email = "joao.faria@unige.ch" },
]
keywords = ["astronomy", "exoplanets", "PLATO", "radial velocity", "observation planning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Astronomy",
]

# Core runtime dependencies (keep this list lean)
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "astropy>=6.0",
    "astroplan>=0.9",
    "astroquery>=0.4.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
inference = [
    "emcee>=3.1",
    "radvel>=1.4",
]
transit = [
    "batman-package>=2.4.9",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
docs = [
    "zensical",
    "mkdocstrings-python",
]
all = ["plato-dialogues[inference,transit]"]

[project.urls]
Homepage = "https://github.com/your-username/plato-dialogues"
Documentation = "https://plato-dialogues.readthedocs.io"
Issues = "https://github.com/your-username/plato-dialogues/issues"

[project.scripts]
dialogues = "dialogues.cli:main"

# src layout: distribution is "plato-dialogues", import name is "dialogues"
[tool.hatch.build.targets.wheel]
packages = ["src/dialogues"]

[tool.hatch.build.targets.sdist]
include = ["src/dialogues", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
